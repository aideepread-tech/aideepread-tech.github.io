<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 科技偵查知識庫 | Curation Feed</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div id="app" class="min-h-screen pb-10">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="ph ph-detective text-blue-600 text-2xl"></i>
                AI 科技偵查知識庫
            </h1>
            <a href="您的GOOGLE表單連結" target="_blank" class="bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-blue-700 transition flex items-center gap-1">
                <i class="ph ph-star"></i> 許願/投稿
            </a>
        </div>
    </header>

    <div class="container mx-auto px-4 mt-6 mb-6">
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center bg-white p-4 rounded-xl shadow-sm">
            <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-hide">
                <button @click="filterCategory = ''" :class="filterCategory === '' ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-600'" class="px-4 py-1.5 rounded-full text-sm whitespace-nowrap transition">全部</button>
                <button @click="filterCategory = '深度分析'" :class="filterCategory === '深度分析' ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-600'" class="px-4 py-1.5 rounded-full text-sm whitespace-nowrap transition">深度分析</button>
                <button @click="filterCategory = '工具教學'" :class="filterCategory === '工具教學' ? 'bg-green-600 text-white' : 'bg-green-50 text-green-600'" class="px-4 py-1.5 rounded-full text-sm whitespace-nowrap transition">工具教學</button>
            </div>
            <div class="relative w-full md:w-64">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input v-model="searchQuery" type="text" placeholder="搜尋關鍵字..." class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-full focus:outline-none focus:border-blue-500 text-sm">
            </div>
        </div>
    </div>

    <main class="container mx-auto px-4">
        <div v-if="loading" class="text-center py-20 text-gray-500">
            <i class="ph ph-spinner animate-spin text-3xl"></i>
            <p class="mt-2">資料載入中...</p>
        </div>

        <div v-else class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <article v-for="item in filteredContent" :key="item.id" class="bg-white rounded-2xl shadow-sm hover:shadow-md transition duration-300 overflow-hidden border border-gray-100 flex flex-col">
                
                <div class="relative w-full aspect-video bg-black group">
                    <iframe 
                        :src="`https://www.youtube.com/embed/${item.youtube_id}`" 
                        title="YouTube video player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen
                        class="w-full h-full absolute top-0 left-0"
                    ></iframe>
                </div>

                <div class="p-5 flex-grow">
                    <div class="flex items-center justify-between mb-3">
                        <span class="bg-blue-50 text-blue-700 text-xs px-2 py-1 rounded font-medium">{{ item.category }}</span>
                        <span class="text-gray-400 text-xs">{{ formatDate(item.date) }}</span>
                    </div>

                    <h3 class="text-lg font-bold text-gray-800 mb-2 leading-snug hover:text-blue-600 transition">
                        <a :href="item.guide_link" target="_blank">{{ item.title }}</a>
                    </h3>

                    <p class="text-gray-600 text-sm line-clamp-3 mb-4 leading-relaxed">
                        {{ item.summary }}
                    </p>

                    <a :href="item.guide_link" target="_blank" class="inline-flex items-center justify-center w-full bg-gray-900 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 transition gap-2">
                        <i class="ph ph-presentation-chart"></i>
                        閱讀完整簡報 & 筆記
                    </a>
                </div>

                <div class="bg-gray-50 px-5 py-3 border-t border-gray-100 text-xs">
                    <div class="flex items-start gap-2 text-gray-500">
                        <i class="ph ph-quotes flex-shrink-0 mt-0.5 text-gray-400"></i>
                        <div class="flex-grow">
                            <span class="font-medium text-gray-700">Source:</span>
                            <a :href="item.source_url" target="_blank" class="hover:underline hover:text-blue-600 transition">
                                {{ item.source_title }}
                            </a>
                            <div class="mt-0.5 text-gray-400">
                                by {{ item.source_author }} <span v-if="item.citation_note">({{ item.citation_note }})</span>
                            </div>
                        </div>
                    </div>
                </div>

            </article>

        </div>
        
        <div v-if="!loading && filteredContent.length === 0" class="text-center py-20 text-gray-500">
            <i class="ph ph-magnifying-glass text-4xl mb-2 text-gray-300"></i>
            <p>找不到相關內容，試試其他關鍵字？</p>
        </div>
    </main>

    <footer class="text-center text-gray-400 text-xs py-10">
        <p>© 2025 AI 科技偵查知識庫. Curated by [您的名字/筆名].</p>
    </footer>

</div>

<script>
    const { createApp } = Vue;
    // ★ 請替換成您 Google Apps Script 的網址
    const API_URL = '您的_GOOGLE_APPS_SCRIPT_網址';

    createApp({
        data() {
            return {
                loading: true,
                contentList: [],
                searchQuery: '',
                filterCategory: ''
            }
        },
        computed: {
            filteredContent() {
                return this.contentList.filter(item => {
                    const matchSearch = (
                        item.title.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                        item.summary.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                        item.tags.toLowerCase().includes(this.searchQuery.toLowerCase())
                    );
                    const matchCat = this.filterCategory ? item.category === this.filterCategory : true;
                    return matchSearch && matchCat;
                });
            }
        },
        methods: {
            formatDate(dateStr) {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return d.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
            }
        },
        mounted() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    this.contentList = data.content;
                    // 按日期排序 (新的在前)
                    this.contentList.sort((a, b) => new Date(b.date) - new Date(a.date));
                    this.loading = false;
                })
                .catch(err => {
                    console.error('API Error:', err);
                    this.loading = false;
                });
        }
    }).mount('#app');
</script>

</body>
</html>
