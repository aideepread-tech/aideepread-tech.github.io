<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRead AI | 深度閱讀與科技快訊</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- 核心變數 --- */
        :root {
            --bg-body: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --accent: #2563eb;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background: #fff;
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .brand {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f172a;
            margin: 0;
        }

        .tagline {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        /* --- Tab 切換 --- */
        .tab-container {
            display: flex;
            justify-content: center;
            margin: 2rem 0;
            gap: 12px;
        }

        .tab-btn {
            background: #fff;
            border: 1px solid #cbd5e1;
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #0f172a;
            color: #fff;
            border-color: #0f172a;
        }

        /* --- 主容器 --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
        }

        /* --- Grid 佈局 --- */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); /* 卡片稍微寬一點 */
            gap: 30px;
        }

        /* --- 卡片設計 --- */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        /* 影片容器：保持 16:9 */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .card-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* 頂部資訊列 (日期 + 分類) */
        .card-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .category-badge {
            background: #e0f2fe;
            color: #0369a1;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .card-date {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            line-height: 1.4;
            color: var(--text-main);
        }

        .card-tags {
            margin-bottom: 15px;
        }

        .tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 5px;
            display: inline-block;
        }

        .card-summary {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .btn-read {
            display: block;
            background: #0f172a;
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .btn-read:hover {
            background: #334155;
        }

        /* --- 許願排行榜 --- */
        .wishlist-wrapper { max-width: 800px; margin: 0 auto; }
        
        .wishlist-header {
            text-align: center;
            margin-bottom: 30px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
        }

        .wish-item {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .rank {
            width: 30px; 
            height: 30px; 
            background: #f1f5f9; 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: bold;
            color: #64748b;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        /* 前三名顏色 */
        .rank-1 { background: #fef3c7; color: #b45309; }
        .rank-2 { background: #e5e7eb; color: #374151; }
        .rank-3 { background: #ffedd5; color: #c2410c; }

        .wish-content { flex-grow: 1; font-weight: 500; }
        .vote-count { font-weight: 700; color: #ef4444; }

        /* RWD */
        @media (max-width: 600px) {
            .grid-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="brand">DeepRead AI</h1>
        <p class="tagline">Unlocking Knowledge, One Slide at a Time.</p>
    </header>

    <div class="container">
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('articles')">文章與影片</button>
            <button class="tab-btn" onclick="switchTab('wishlist')">許願排行榜</button>
        </div>

        <div id="loading" style="text-align:center; padding:50px; color:#64748b;">
            載入資料中...
        </div>

        <div id="articles-view" class="grid-layout" style="display: none;">
            </div>

        <div id="wishlist-view" class="wishlist-wrapper" style="display: none;">
            <div class="wishlist-header">
                <h3>想看什麼新技術解析？</h3>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSeFvIvo8i4tpglifjcnXn_R_cFy4csRPZEOzNxf07QFmguvmA/viewform?usp=sharing" target="_blank" style="display:inline-block; margin-top:10px; color:#2563eb; font-weight:600; text-decoration:none;">前往許願池投票 →</a>
            </div>
            <div id="wishlist-container">
                </div>
        </div>
    </div>

    <footer>
        <p style="color:#94a3b8; font-size:0.8rem; text-align:center;">&copy; 2025 DeepRead AI. Powered by Google Sheets.</p>
    </footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzT4i3PGhMn1YRzwRUrvxrMnha2PSbQaLcStfQeG3fzcxkb0eZig1NW4QxU8Zk23wLCqg/exec';

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';
                
                renderArticles(data.content);
                renderWishlist(data.wishlist);
                
                // 顯示 Grid
                document.getElementById('articles-view').style.display = 'grid';

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').innerHTML = '讀取失敗，請重新整理。';
            }
        }

        function renderArticles(articles) {
            const container = document.getElementById('articles-view');
            
            // 排序：新日期在前
            articles.sort((a, b) => new Date(b.date) - new Date(a.date));

            if(articles.length === 0) {
                container.innerHTML = '<p>目前沒有資料。</p>';
                return;
            }

            const html = articles.map(article => {
                const dateStr = new Date(article.date).toLocaleDateString('zh-TW');
                const tagsHtml = article.tags 
                    ? article.tags.split(' ').slice(0, 3).map(tag => `<span class="tag">${tag}</span>`).join('') 
                    : '';

                // 如果有 YouTube ID 就顯示 iframe，否則顯示圖片或空白
                // 使用 loading="lazy" 優化效能
                let mediaHtml = '';
                if (article.youtube_id) {
                    mediaHtml = `
                        <div class="video-wrapper">
                            <iframe 
                                src="https://www.youtube.com/embed/${article.youtube_id}" 
                                title="YouTube video player" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen
                                loading="lazy">
                            </iframe>
                        </div>`;
                } else {
                    // 若無影片，顯示灰色佔位區塊 (保持版型一致)
                    mediaHtml = `<div class="video-wrapper" style="background:#f1f5f9; display:flex; align-items:center; justify-content:center; color:#94a3b8;">無影片內容</div>`;
                }

                return `
                    <article class="card">
                        ${mediaHtml}
                        <div class="card-body">
                            <div class="card-meta-top">
                                <span class="category-badge">${article.category}</span>
                                <span class="card-date">${dateStr}</span>
                            </div>
                            <h3 class="card-title">${article.title}</h3>
                            <div class="card-tags">${tagsHtml}</div>
                            <p class="card-summary">${article.summary}</p>
                            <a href="${article.guide_link}" target="_blank" class="btn-read">📖 閱讀完整簡報</a>
                        </div>
                    </article>
                `;
            }).join('');

            container.innerHTML = html;
        }

        function renderWishlist(wishlist) {
            const container = document.getElementById('wishlist-container');
            if(!wishlist) return;

            wishlist.sort((a, b) => b['票數'] - a['票數']);

            const html = wishlist.map((item, index) => {
                const rank = index + 1;
                const rankClass = rank <= 3 ? `rank-${rank}` : '';
                
                return `
                    <div class="wish-item">
                        <div class="rank ${rankClass}">${rank}</div>
                        <div class="wish-content">${item['主題']}</div>
                        <div class="vote-count">${item['票數']} 票</div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = html;
        }

        function switchTab(tabName) {
            const articlesView = document.getElementById('articles-view');
            const wishlistView = document.getElementById('wishlist-view');
            const btns = document.querySelectorAll('.tab-btn');

            btns.forEach(b => b.classList.remove('active'));

            if (tabName === 'articles') {
                btns[0].classList.add('active');
                articlesView.style.display = 'grid'; // 保持 grid 屬性
                wishlistView.style.display = 'none';
            } else {
                btns[1].classList.add('active');
                articlesView.style.display = 'none';
                wishlistView.style.display = 'block';
            }
        }
    </script>
</body>
</html>
